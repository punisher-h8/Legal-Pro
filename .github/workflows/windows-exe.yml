name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install builder
        run: python -m pip install -r requirements-build.txt
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python build.py
      - name: Test executable resources
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\LegalVault-Pro.exe -ArgumentList '--self-test','--report','self-test-exe.json' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Executable self-test failed' }
          $report = Get-Content self-test-exe.json -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.frozen) { throw 'Invalid executable report' }
      - uses: actions/upload-artifact@v4
        with:
          name: LegalVault-Pro-Windows-EXE
          path: |
            dist/LegalVault-Pro.exe
            README.md
            self-test-exe.json
          if-no-files-found: error
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Validate installer inputs
        shell: pwsh
        run: |
          if (-not (Test-Path .\installer\LegalVault-Pro.iss)) { throw 'Missing Inno Setup script' }
          if (-not (Test-Path .\dist\LegalVault-Pro.exe)) { throw 'Missing executable' }
      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\installer\LegalVault-Pro.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: LegalVault-Pro-Windows-Installer
          path: installer-output/LegalVault-Pro-Setup.exe
          if-no-files-found: error
      - name: Publish installer release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/LegalVault-Pro-Setup.exe
          generate_release_notes: true
